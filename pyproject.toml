[build-system] 
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seizmeia"
description = "A credit management tool for a beer tap."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Diogo Correia", email = "dv_correia@hotmail.com" },
]
licencse = {file = "LICENSE.txt"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "fastapi>=0.95.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.16.0",
    "pydantic[email]>=1.10.7",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.5",
    "sqlalchemy[asyncio]>=2.0.8",
    "PyYAML>=6.0",
    "uvicorn~=0.21.1"
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "black==23.1.0",
    "coverage>=7.2.2",
    "isort>=5.12.0",
    "mypy==1.1.1",
    "pre-commit>=3.2.0",
    "pytest>=7",
    "pytest-asyncio",
    "pytest-sugar",
    "tox>=4",
    "types-PyYAML>=6.0.12.8",
    "ruff>=0.0.246",
    "hatch",
    "pip-tools~=6.12.3"
]
docs = [
    "mkdocs>=1.4.2",
    "mkdocs-material>=9.1.4"
]

[project.scripts]
seizmeia = "seizmeia._main:main"

[tool.hatch.version]
path = "seizmeia/__init__.py"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["tests*", "web*"]  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # false to disable scanning PEP 420 namespaces (true by default) (resource: https://www.youtube.com/watch?v=2Xvb79hOUdM)

[tool.black]
line-length = 79
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 79
src_paths = ["seizmeia", "tests"]
add_imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.11"
exclude = [
    ".venv"
]
plugins = [
    "sqlalchemy.ext.mypy.plugin"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["seizmeia"]
omit = [
    "venv/*",
    ".venv/*",
    "tests/*"
]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    # "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "C901",  # too complex
    "B008",  # function call in argument defaults
]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__"
]

# same as Black.
line-length = 88

# allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# assume python version.
target-version = "py311"

[tool.ruff.mccabe]
# unlike Flake8, default to a complexity level of 10.
max-complexity = 10